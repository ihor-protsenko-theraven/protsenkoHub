services:
  pgadmin:
    image: dpage/pgadmin4:9.18
    restart: unless-stopped
    env_file:
      - .env.pgadmin
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./.pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - db

volumes:
  pgadmin-data:
