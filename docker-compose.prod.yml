services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-protsenko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-protsenkohub}
    volumes:
      - protsenko-prod-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-protsenko} -d ${POSTGRES_DB:-protsenkohub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      SERVE_WEB: "true"
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-protsenko}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-protsenkohub}?schema=public}
      DIRECT_URL: ${DIRECT_URL:-postgresql://${POSTGRES_USER:-protsenko}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-protsenkohub}?schema=public}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: https://${APP_DOMAIN:-localhost}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      CRON_SECRET: ${CRON_SECRET:-}
      SLEEP_REMINDER_SCHEDULER_URL: ${SLEEP_REMINDER_SCHEDULER_URL:-}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  protsenko-prod-db:
  caddy-data:
  caddy-config:
