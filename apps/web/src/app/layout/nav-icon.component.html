@let icon = name();
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
     stroke-linejoin="round" aria-hidden="true">
  @switch (icon) {
    @case ('home') {
      <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>
    }
    @case ('calendar') {
      <rect x="3" y="5" width="18" height="16" rx="2"/>
      <path d="M7 3v4m10-4v4M3 10h18m-13 5h3m3 0h2"/>
    }
    @case ('shopping') {
      <path d="M3 4h2l2 11h12l2-8H6m2 12h.01M18 19h.01"/>
      <circle cx="8" cy="19" r="1"/>
      <circle cx="18" cy="19" r="1"/>
    }
    @case ('children') {
      <circle cx="12" cy="8" r="3"/>
      <path d="M6 21v-2a6 6 0 0 1 12 0v2M5 12l-2 3m16-3 2 3"/>
    }
    @case ('sleep') {
      <path d="M20.5 15.5A9 9 0 0 1 8.5 3.5 9 9 0 1 0 20.5 15.5Z"/>
      <path d="m17 3 .4 1.6L19 5l-1.6.4L17 7l-.4-1.6L15 5l1.6-.4z"/>
    }
    @case ('feeding') {
      <path d="M4 10h16a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6z"/>
      <path d="M8 10V8a4 4 0 0 1 8 0v2M9 17.5 8 21m7-3.5 1 3.5"/>
    }
    @case ('contacts') {
      <rect x="4" y="3" width="16" height="18" rx="2"/>
      <circle cx="12" cy="9" r="2"/>
      <path d="M8 17a4 4 0 0 1 8 0M4 6H2m2 6H2m2 6H2"/>
    }
    @case ('family') {
      <circle cx="8" cy="8" r="2.5"/>
      <circle cx="16.5" cy="8.5" r="2"/>
      <path d="M3 20v-2a5 5 0 0 1 10 0v2m1-7a4.5 4.5 0 0 1 7 3.7V20h-5"/>
    }
    @default never;
  }
</svg>
